<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool UI Effects</title>
    <style>
        /* General Page Styling */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            gap: 50px;
        }

        /* 1. Animated Gradient Text */
        .animated-text {
            font-size: 60px;
            font-weight: 800;
            background: linear-gradient(to right, #6666ff, #0099ff, #00ffcc, #ff00ff, #6666ff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientMove 3s linear infinite;
            text-align: center;
        }

        @keyframes gradientMove {
            to { background-position: 200% center; }
        }

        /* 2. Glassmorphism Card */
        .glass-card {
            width: 320px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-card h2 {
            margin-top: 0;
            color: #03e9f4;
        }

        /* 3. Neon Glow Button */
        .neon-btn {
            padding: 15px 35px;
            font-size: 18px;
            background: transparent;
            color: #03e9f4;
            border: 2px solid #03e9f4;
            cursor: pointer;
            transition: 0.5s;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            position: relative;
            outline: none;
        }

        .neon-btn:hover {
            background: #03e9f4;
            color: #050801;
            box-shadow: 0 0 5px #03e9f4,
                        0 0 25px #03e9f4,
                        0 0 50px #03e9f4,
                        0 0 100px #03e9f4;
        }

        /* Background Decorative Circles */
        .circle {
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(80px);
        }
        .circle-1 { width: 300px; height: 300px; background: #6666ff; top: 10%; left: 10%; opacity: 0.3; }
        .circle-2 { width: 400px; height: 400px; background: #ff00ff; bottom: 10%; right: 10%; opacity: 0.2; }

    </style>
</head>
<body>

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <h1 class="animated-text">CREATIVE CODE</h1>

    <div class="glass-card">
        <h2>Glass Design</h2>
        <p>This UI uses <b>backdrop-filter</b> to create a frosted glass effect that blends into the background colors.</p>
    </div>

    <button class="neon-btn" onclick="alert('System Activated!')">Activate</button>

</body>
</html>
