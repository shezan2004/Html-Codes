<!DOCTYPE html>
<html>
<head>
    <title>Integer Complement</title>
</head>

<body>

<h2>Find Complement of an Integer</h2>

<label>Enter a number:</label>
<input type="number" id="num">
<button onclick="findComplement()">Calculate</button>

<p id="result"></p>

<script>
function findComplement() {
    var n = parseInt(document.getElementById("num").value);

    if (n === 0) {
        document.getElementById("result").innerHTML = "Complement: 1";
        return;
    }

    var mask = 1;

    while (mask <= n) {
        mask = mask << 1;
    }

    mask = mask - 1;

    var complement = mask ^ n;

    document.getElementById("result").innerHTML = "Complement: " + complement;
}
</script>

</body>
</html>
