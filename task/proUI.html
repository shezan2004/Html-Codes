<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro UI Component</title>
    <style>
        /* Modern Reset & Custom Properties */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Ambient Background Glows */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--accent-glow);
            filter: blur(80px);
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before { top: 20%; left: 25%; }
        body::after { bottom: 20%; right: 25%; animation-delay: -4s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(20px) scale(1.1); }
        }

        /* The Card */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem;
            width: 350px;
            border-radius: 24px;
            text-align: center;
            color: var(--text-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.4s ease, 
                        border-color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(2deg);
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        0 0 40px rgba(129, 140, 248, 0.1);
        }

        /* Profile Image Setup */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #ec4899);
            z-index: -1;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }

        .card:hover .avatar-container::before {
            opacity: 1;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e1b4b; /* Placeholder background */
            border: 4px solid #0f172a;
        }

        /* Typography */
        .name {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .role {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Button/Action */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem;
            background: #fff;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Profile Picture">
        </div>
        <h2 class="name">Alex Rivers</h2>
        <p class="role">Creative Director</p>
        <p class="bio">Crafting high-end digital experiences through minimalist design, robust frontend architecture, and interactive motion design.</p>
        <button class="btn">Connect</button>
    </div>

</body>
</html>
