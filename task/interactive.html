<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Theme Card</title>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.4s ease;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            transition: transform 0.3s ease, background 0.4s ease, color 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        h2 { margin-top: 0; color: #333; }
        p { color: #666; line-height: 1.6; }

        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 20px;
            transition: background 0.2s;
        }

        button:hover { background-color: #4f46e5; }

        /* Dark Mode Styling */
        body.dark-mode { background-color: #0f172a; }
        .card.dark-mode { background-color: #1e293b; color: #f8fafc; }
        .card.dark-mode h2, .card.dark-mode p { color: #f8fafc; }
        .card.dark-mode button { background-color: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

    <div class="card" id="myCard">
        <h2>Interactive Card</h2>
        <p>This is a single-file demonstration using HTML, CSS, and vanilla JavaScript logic.</p>
        <button id="themeBtn">Switch to Dark Mode</button>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const card = document.getElementById('myCard');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            // Toggle the dark-mode class
            body.classList.toggle('dark-mode');
            card.classList.toggle('dark-mode');

            // Update button text based on current mode
            if (body.classList.contains('dark-mode')) {
                themeBtn.textContent = "Switch to Light Mode";
            } else {
                themeBtn.textContent = "Switch to Dark Mode";
                hfj
            }
        });
    </script>
</body>
</html>
