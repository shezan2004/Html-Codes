<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sci-Fi Orbit Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="void-container">
        <div class="core-energy"></div>

        <div class="orbit-ring">
            <div class="orbit-node" style="--node-index: 1;">
                <span class="icon">✦</span>
                <span class="label">Home</span>
            </div>
            <div class="orbit-node" style="--node-index: 2;">
                <span class="icon">⬢</span>
                <span class="label">Projects</span>
            </div>
            <div class="orbit-node" style="--node-index: 3;">
                <span class="icon">▲</span>
                <span class="label">Labs</span>
            </div>
            <div class="orbit-node" style="--node-index: 4;">
                <span class="icon">✖</span>
                <span class="label">About</span>
            </div>
            <div class="orbit-node" style="--node-index: 5;">
                <span class="icon">◆</span>
                <span class="label">Contact</span>
            </div>
        </div>
    </div>

</body>
</html>
