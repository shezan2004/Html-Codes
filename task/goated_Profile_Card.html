<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goated Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">
        <div class="card-glow"></div>
        <div class="avatar-container">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=256&auto=format&fit=crop" alt="Avatar">
        </div>
        <div class="info">
            <h2>Alex Rivers</h2>
            <p class="title">Creative Developer</p>
            <p class="bio">Building high-performance digital experiences with pixel-perfect precision.</p>
        </div>
        <div class="stats">
            <div class="stat-box">
                <span class="number">142</span>
                <span class="label">Projects</span>
            </div>
            <div class="stat-box">
                <span class="number">12.5k</span>
                <span class="label">Followers</span>
            </div>
        </div>
        <div class="socials">
            <a href="#" class="social-icon"><i class="fab fa-github"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-linkedin"></i></a>
        </div>
        <button class="action-btn">Follow Me</button>
    </div>

</body>
</html>
