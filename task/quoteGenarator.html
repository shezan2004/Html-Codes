<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .quote-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .quote-container:hover {
            transform: translateY(-5px);
        }

        .quote-text {
            font-size: 1.5rem;
            font-style: italic;
            margin-bottom: 20px;
            color: #4a5568;
            line-height: 1.4;
        }

        .quote-author {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background-color: #5a67d8;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="quote-container">
        <div class="quote-text">"The only way to do great work is to love what you do."</div>
        <div class="quote-author">- Steve Jobs</div>
        <button class="btn" id="new-quote-btn">New Quote</button>
    </div>

    <script>
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
            { text: "Purpose is the lamp which illuminates the dark path of life.", author: "Lailah Gifty Akita" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
            { text: "Strive not to be a success, but rather to be of value.", author: "Albert Einstein" },
            { text: "The mind is everything. What you think you become.", author: "Buddha" }
        ];

        const quoteTextElement = document.querySelector('.quote-text');
        const quoteAuthorElement = document.querySelector('.quote-author');
        const button = document.getElementById('new-quote-btn');

        button.addEventListener('click', () => {
            // Pick a random quote that is different from the current one
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (`"${quotes[randomIndex].text}"` === quoteTextElement.innerText);

            // Update the DOM
            quoteTextElement.innerText = `"${quotes[randomIndex].text}"`;
            quoteAuthorElement.innerText = `- ${quotes[randomIndex].author}`;
        });
    </script>
</body>
</html>
