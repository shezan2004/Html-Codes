<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Discount Calculator</title>
    <style>
        /* --- CSS STYLING --- */
        :root {
            --primary: #4f46e5;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --free-bg: #fef3c7;
            --free-border: #f59e0b;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Responsive Grid Alignment */
        .candy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .candy-card {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Style applied to the free items */
        .candy-card.free-item {
            background-color: var(--free-bg);
            border-color: var(--free-border);
            color: #b45309;
        }

        .candy-card .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }

        .candy-card.free-item .tag {
            color: #b45309;
        }

        .total-display {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: right;
            border-top: 2px solid #f1f5f9;
            padding-top: 15px;
        }

        .total-display span {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Candy Discount Calculator</h1>
        
        <div class="input-group">
            <input type="text" id="candyInput" placeholder="Enter costs separated by commas (e.g., 6,5,7,9,2,2)">
            <button onclick="calculateCost()">Calculate</button>
        </div>

        <div class="candy-grid" id="candyGrid">
            </div>

        <div class="total-display">
            Minimum Total Cost: <span id="totalCost">$0</span>
        </div>
    </div>

    <script>
        function calculateCost() {
            const inputVal = document.getElementById('candyInput').value;
            const gridContainer = document.getElementById('candyGrid');
            const totalDisplay = document.getElementById('totalCost');
            
            // Clear previous UI elements
            gridContainer.innerHTML = '';

            // Convert raw input string into an array of clean numbers
            let cost = inputVal.split(',')
                             .map(num => parseInt(num.trim()))
                             .filter(num => !isNaN(num) && num > 0);

            if (cost.length === 0) {
                totalDisplay.innerText = '$0';
                return;
            }

            // 1. Greedy approach: Sort descending to maximize free savings
            cost.sort((a, b) => b - a);

            let totalCost = 0;

            // 2. Build the layout and crunch math on the fly
            cost.forEach((price, index) => {
                const card = document.createElement('div');
                card.classList.add('candy-card');

                // Check if it's the 3rd candy in a group (0-indexed indices: 2, 5, 8...)
                const isFree = (index + 1) % 3 === 0;

                if (isFree) {
                    card.classList.add('free-item');
                    card.innerHTML = `<span class="tag">Free</span> <span>$${price}</span>`;
                } else {
                    totalCost += price;
                    card.innerHTML = `<span class="tag">Candy ${index + 1}</span> <span>$${price}</span>`;
                }

                gridContainer.appendChild(card);
            });

            // Update Total DOM Element
            totalDisplay.innerText = `$${totalCost}`;
        }
    </script>
</body>
</html>
