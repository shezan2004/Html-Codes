<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Premium Card</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #1a1a3a 0%, #0d0d13 100%);
            overflow: hidden;
            position: relative;
        }

        /* Decorative Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #ff007f;
            top: 20%;
            left: 25%;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #00f2fe;
            bottom: 15%;
            right: 25%;
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Glassmorphic Card Container */
        .card {
            position: relative;
            z-index: 10;
            width: 350px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 242, 254, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Avatar Styling with Gradient Border */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #00f2fe);
            padding: 3px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #13131a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #fff;
        }

        /* Typography */
        .name {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .role {
            color: #00f2fe;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .bio {
            color: #b3b3cc;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Action Button */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: filter 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <div class="avatar">✨</div>
        </div>
        <h2 class="name">SHEZ@N</h2>
        <p class="role">Creative Director</p>
        <p class="bio">Building high-fidelity interfaces and modern digital experiences with clean code and cutting-edge visual layouts.</p>
        <button class="btn">View Portfolio</button>
    </div>

</body>
</html>
