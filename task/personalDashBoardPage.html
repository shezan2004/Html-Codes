<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        .sidebar {
            width: 200px;
            height: 100vh;
            background: #34495e;
            color: white;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #2c3e50;
        }

        .main {
            margin-left: 220px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .cards .card {
            flex: 1;
            text-align: center;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 100px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Dashboard</h2>
    <a href="#">Home</a>
    <a href="#">Profile</a>
    <a href="#">Tasks</a>
    <a href="#">Settings</a>
</div>

<div class="main">

    <div class="card profile">
        <img src="https://via.placeholder.com/100" alt="Profile">
        <h3>Your Name</h3>
        <p>Web Developer</p>
    </div>

    <div class="cards">
        <div class="card">
            <h3>12</h3>
            <p>Tasks</p>
        </div>
        <div class="card">
            <h3>5</h3>
            <p>Projects</p>
        </div>
        <div class="card">
            <h3>3</h3>
            <p>Messages</p>
        </div>
    </div>

    <div class="card">
        <h3>Quick Notes</h3>
        <textarea rows="4" style="width:100%;"></textarea>
    </div>

</div>

</body>
</html>
