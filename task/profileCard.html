<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <div class="profile-card">
            <div class="profile-image">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Profile Picture">
            </div>
            
            <div class="profile-info">
                <h1 class="name">Alex Morgan</h1>
                <p class="title">UI/UX Designer & Developer</p>
                <p class="bio">Passionate about creating clean, accessible, and user-centric digital experiences. Always learning, always building.</p>
            </div>

            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-number">42</span>
                    <span class="stat-label">Projects</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">12k</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">4.9</span>
                    <span class="stat-label">Rating</span>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary">Follow</button>
                <button class="btn btn-secondary">Message</button>
            </div>
        </div>
    </div>

</body>
</html>
