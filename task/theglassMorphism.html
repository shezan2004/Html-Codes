<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Glassmorphism Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Animated background blobs */
.blob{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter: blur(80px);
    opacity:0.7;
    animation: float 10s infinite ease-in-out alternate;
}

.blob1{
    background:#00f5ff;
    top:-80px;
    left:-80px;
}

.blob2{
    background:#ff00c8;
    bottom:-100px;
    right:-100px;
    animation-delay:2s;
}

@keyframes float{
    from{
        transform:translateY(0px) translateX(0px);
    }
    to{
        transform:translateY(40px) translateX(20px);
    }
}

/* Card */
.card{
    width:380px;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
    position:relative;
    z-index:2;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
}

.profile{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:4px solid rgba(255,255,255,0.3);
    box-shadow:0 0 25px rgba(255,255,255,0.2);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    margin-top:20px;
    font-size:32px;
    letter-spacing:1px;
}

p{
    margin-top:12px;
    color:#d1d5db;
    line-height:1.6;
    font-size:15px;
}

.buttons{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    padding:12px 24px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
    font-weight:bold;
}

.follow{
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
}

.message{
    background:rgba(255,255,255,0.1);
    color:white;
    border:1px solid rgba(255,255,255,0.2);
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.glow{
    position:absolute;
    inset:0;
    border-radius:30px;
    pointer-events:none;
    overflow:hidden;
}

.glow::before{
    content:'';
    position:absolute;
    width:150px;
    height:500px;
    background:rgba(255,255,255,0.15);
    transform:rotate(25deg);
    top:-150px;
    left:-250px;
    animation: shine 6s infinite linear;
}

@keyframes shine{
    100%{
        left:600px;
    }
}

.counter{
    margin-top:25px;
    font-size:20px;
    color:#fff;
}

.counter span{
    color:#00f5ff;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="card">
    
    <div class="glow"></div>

    <div class="profile">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800&auto=format&fit=crop" alt="">
    </div>

    <h1>Creative Soul</h1>

    <p>
        Designing beautiful digital experiences with creativity,
        motion and modern aesthetics.
    </p>

    <div class="buttons">
        <button class="follow" onclick="follow()">Follow</button>
        <button class="message">Message</button>
    </div>

    <div class="counter">
        Followers: <span id="count">1200</span>
    </div>

</div>

<script>
let count = 1200;

function follow(){
    count++;
    document.getElementById("count").innerText = count;

    const btn = document.querySelector(".follow");
    btn.innerText = "Following ✓";

    btn.style.background = "linear-gradient(45deg,#22c55e,#16a34a)";
}
</script>

</body>
</html>
