<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern UI Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for easy color management */
        :root {
            --bg-color: #e0e5ec;
            --text-color: #444;
            --accent-color: #6d5dfc;
            --white: #ffffff;
            --shadow: 9px 9px 16px rgb(163,177,198,0.6), 
                      -9px -9px 16px rgba(255,255,255, 0.5);
            --inner-shadow: inset 6px 6px 10px 0 rgba(0, 0, 0, 0.1),
                            inset -6px -6px 10px 0 rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* The Card Container */
        .container {
            width: 350px;
            padding: 40px;
            border-radius: 30px;
            background: var(--bg-color);
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: scale(1.02);
        }

        /* Profile Image with Neumorphic Ring */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
            border: 5px solid var(--bg-color);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Text Styles */
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 25px;
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--bg-color);
            box-shadow: var(--shadow);
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:active {
            box-shadow: var(--inner-shadow);
            transform: translateY(2px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--white);
        }

        .btn-primary:active {
            background: #5b4cfc;
        }

        /* Footer Info */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .stat-item span {
            display: block;
            font-weight: 600;
        }

        .stat-item small {
            font-size: 0.75rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">
