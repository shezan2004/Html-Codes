<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Digital Clock</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.4s, color 0.4s;
        }

        /* Theme Classes */
        .light-theme {
            background-color: #f4f4f9;
            color: #333333;
        }
        .dark-theme {
            background-color: #1e1e1e;
            color: #f4f4f9;
        }

        /* Container Styling */
        .widget {
            text-align: center;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: inherit;
            border: 1px solid rgba(128, 128, 128, 0.2);
        }

        #clock {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body class="light-theme">

    <div class="widget">
        <div id="clock">00:00:00</div>
        <button id="themeToggle">Switch to Dark Mode</button>
    </div>

    <script>
        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            // Formats the time to local string (e.g., "02:45:10 PM")
            const timeString = now.toLocaleTimeString(); 
            document.getElementById('clock').textContent = timeString;
        }

        // Run the clock immediately, then update it every 1000 milliseconds (1 second)
        updateClock();
        setInterval(updateClock, 1000);

        // --- Theme Toggle Logic ---
        const body = document.body;
        const toggleBtn = document.getElementById('themeToggle');

        toggleBtn.addEventListener('click', () => {
            // Check current theme and switch to the other
            if (body.classList.contains('light-theme')) {
                body.classList.replace('light-theme', 'dark-theme');
                toggleBtn.textContent = 'Switch to Light Mode';
            } else {
                body.classList.replace('dark-theme', 'light-theme');
                toggleBtn.textContent = 'Switch to Dark Mode';
            }
        });
    </script>

</body>
</html>
