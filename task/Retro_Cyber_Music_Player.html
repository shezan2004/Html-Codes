<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cyber Music Player</title>
    <style>
        /* Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Deep dark slate blue */
            padding: 20px;
        }

        /* Player Container */
        .player-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 340px;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Album Art Work */
        .album-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Decorative vinyl record effect inside album art */
        .album-art::before {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        /* Song Details */
        .song-title {
            color: #f8fafc;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .artist-name {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        /* Progress Bar Section */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }

        /* Styling the slider thumb handle */
        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            transition: transform 0.1s ease;
        }

        .progress-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #60a5fa;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s, transform 0.2s;
        }

        .btn:hover {
            color: #f8fafc;
        }

        .btn-secondary {
            font-size: 1.5rem;
        }

        .btn-play {
            width: 56px;
            height: 56px;
            background: #f8fafc;
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-play:hover {
            transform: scale(1.05);
            background: #ffffff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art"></div>
        
        <div class="song-title">Neon Horizons</div>
        <div class="artist-name">Starlight Arcade</div>
        
        <div class="progress-container">
            <input type="range" class="progress-slider" min="0" max="100" value="35">
            <div class="time-stamps">
                <span>1:14</span>
                <span>3:45</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-secondary">&#9194;</button>
            
            <button class="btn btn-play" id="playBtn">&#9654;</button>
            
            <button class="btn btn-secondary">&#9193;</button>
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                // Change icon to Pause symbol (⏸)
                playBtn.innerHTML = '&#9208;';
                playBtn.style.boxShadow = '0 0 20px rgba(59, 130, 246, 0.6)';
            } else {
                // Change icon back to Play symbol (▶)
                playBtn.innerHTML = '&#9654;';
                playBtn.style.boxShadow = '0 4px 12px rgba(255, 255, 255, 0.2)';
            }
        });
    </script>

</body>
</html>
