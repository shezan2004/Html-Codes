<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Player</title>
    <style>
        /* CSS resets and base layout */
        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* The Main Card */
        .player-card {
            width: 320px;
            padding: 40px;
            background: #e0e0e0;
            border-radius: 50px;
            box-shadow: 20px 20px 60px #bebebe, 
                       -20px -20px 60px #ffffff;
            text-align: center;
        }

        /* The Album Art "Well" */
        .album-art {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Inset shadows create the "sunken" look */
            box-shadow: inset 8px 8px 16px #bebebe, 
                        inset -8px -8px 16px #ffffff;
        }

        .inner-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f0f0f0, #cacaca);
            box-shadow: 6px 6px 12px #bebebe, 
                       -6px -6px 12px #ffffff;
        }

        .song-info h2 {
            color: #444;
            margin: 15px 0 5px;
            letter-spacing: 1px;
        }

        .song-info p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Button Container */
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        /* Neumorphic Buttons */
        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #e0e0e0;
            box-shadow: 6px 6px 12px #bebebe, 
                       -6px -6px 12px #ffffff;
            cursor: pointer;
            color: #777;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pressed State */
        .btn:active {
            box-shadow: inset 4px 4px 8px #bebebe, 
                        inset -4px -4px 8px #ffffff;
            transform: scale(0.98);
            color: #333;
        }

        .play {
            color: #5d9cec; /* Accent color for play button */
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art">
            <div class="inner-circle"></div>
        </div>
        
        <div class="song-info">
            <h2>Midnight City</h2>
            <p>M83 • Hurry Up, We're Dreaming</p>
        </div>
        
        <div class="controls">
            <button class="btn"><span>&#10094;</span></button>
            <button class="btn play"><span>&#9654;</span></button>
            <button class="btn"><span>&#10095;</span></button>
        </div>
    </div>

</body>
</html>
