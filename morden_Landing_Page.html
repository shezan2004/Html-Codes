<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Page</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
background:white;
padding:50px;
border-radius:15px;
text-align:center;
width:420px;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
transition:0.3s;
}

.container:hover{
transform:translateY(-8px);
}

h1{
font-size:36px;
margin-bottom:15px;
color:#333;
}

p{
color:#555;
margin-bottom:30px;
line-height:1.6;
}

button{
padding:12px 30px;
border:none;
background:#667eea;
color:white;
font-size:16px;
border-radius:25px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#764ba2;
transform:scale(1.05);
}

.footer{
margin-top:25px;
font-size:14px;
color:#888;
}

</style>
</head>

<body>

<div class="container">
<h1>Welcome</h1>
<p>This is a simple beautiful web page created with pure HTML and CSS. Clean design often looks better than complicated layouts.</p>
<button>Explore</button>
<div class="footer">
Made with HTML & CSS
</div>
</div>

</body>
</html>
