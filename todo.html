<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Tasks - All-in-One</title>
    <style>
        /* CSS Section: Design and Layout */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
        }

        .todo-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #edf2f7;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4a90e2;
        }

        button#addBtn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button#addBtn:hover {
            background-color: #357abd;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #eee;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>Task Master</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="What's the plan?">
            <button id="addBtn">Add</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        /* JS Section: Functionality */
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // 1. Load data when page opens
        document.addEventListener('DOMContentLoaded', () => {
            const savedTasks = JSON.parse(localStorage.getItem('myTasks')) || [];
            savedTasks.forEach(taskText => renderTask(taskText));
        });

        // 2. Add task logic
        function handleAdd() {
            const text = taskInput.value.trim();
            if (text) {
                renderTask(text);
                saveTask(text);
                taskInput.value = '';
            }
        }

        addBtn.addEventListener('click', handleAdd);

        // Allow pressing "Enter" to add
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAdd();
        });

        // 3. UI Rendering
        function renderTask(text) {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${text}</span>
                <button class="delete-btn">Delete</button>
            `;
            
            // Delete logic
            li.querySelector('.delete-btn').addEventListener('click', () => {
                li.remove();
                removeTaskFromStorage(text);
            });

            taskList.appendChild(li);
        }

        // 4. Storage logic
        function saveTask(text) {
            const tasks = JSON.parse(localStorage.getItem('myTasks')) || [];
            tasks.push(text);
            localStorage.setItem('myTasks', JSON.stringify(tasks));
        }

        function removeTaskFromStorage(text) {
            let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];
            tasks = tasks.filter(t => t !== text);
            localStorage.setItem('myTasks', JSON.stringify(tasks));
        }
    </script>
</body>
</html>
